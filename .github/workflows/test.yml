name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  layout:
    # The layout app (layout/) says whether the directories on disk,
    # manifest.json, the .tesser-root files, and the CI jobs agree — and it is
    # itself a full tesser app, gated at the same bar as every other tree.
    # Every scripts/verify run everywhere also runs its check as step 0.
    name: layout app (repo-layout check + tessercheck + mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r layout/requirements-dev.txt
      - name: layout — repo check + tessercheck + mypy --strict + pytest
        run: scripts/verify layout

  generator:
    # The generator app (generator/) writes a tesser app tree from a TOML spec
    # and renders one from a composition. Its own gates run, then every spec
    # is generated and every composition rendered, and each tree is gated like
    # an example: tessercheck zero findings, mypy --strict, and pytest. The
    # trees' tests start their own private Restate engines, Postgres and hosts
    # (docs/design-test-tiers.md), so the job runs no service containers.
    name: generator app (tessercheck + mypy --strict + pytest, then every spec generated and every composition rendered and gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r generator/requirements-dev.txt
      - name: generator — tessercheck + mypy --strict + pytest, then every generated and rendered tree
        run: scripts/verify generator

  llmport:
    # Gates the LLM tool-call port example at the shared example bar: tessercheck
    # zero findings over the whole tree (the srv-vocabulary + wire-module
    # rules resolved the two findings the ratchet used to carry), then
    # mypy --strict + pytest on the pure modules, including the srv router
    # (it imports no livekit). srv/voice/agent.py is in tessercheck's walk
    # (pure AST) but outside the mypy crawl — livekit-agents is not
    # installed in CI; the tree's README records that boundary.
    name: llmport (tessercheck + mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/llmport/requirements-dev.txt
      - name: examples/llmport — tessercheck + mypy --strict + pytest
        run: scripts/verify llmport

  python-app-example:
    # Gates the composition-root / wiring worked example (Python) at the same bar:
    # mypy --strict + pytest, now with the two linters that own its architecture
    # rules. Proves the bounded-context anatomy + srv/config/bootstrap model in
    # running, type-checked code before it is taught. The rules split by who can
    # decide them: ruff owns the env edge and the exit edge, import-linter owns
    # the import direction, and the example's own AST tests keep what no tool
    # covers (import-time side effects, host-routes-never-translates, context
    # discovery).
    name: python-app example (ruff + import-linter + mypy --strict + pytest + tessercheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/python-app/requirements-dev.txt
      - name: examples/python-app — ruff + import-linter + mypy --strict + pytest + tessercheck
        # Zero findings, no ratchet: the conformance wave burned the accepted
        # debt to fixes plus site-level debt markers (the only opt-out mechanism).
        run: scripts/verify python-app

  ports-example:
    # Gates the application-ports worked example (Python) at the same bar:
    # tessercheck zero findings + mypy --strict + pytest. This is the canonical
    # shape an adapter sees — one context, two ports, an enum outcome read with
    # match + assert_never, and a collection answer carried as a tuple. The six
    # encodings it was chosen over live on the spike/application-ports branch;
    # docs/design-application-ports.md carries the measurements.
    name: ports example (tessercheck + mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/ports/requirements-dev.txt
      - name: examples/ports — tessercheck + mypy --strict + pytest
        run: scripts/verify ports

  minimal-example:
    # Gates the minimal tree at the same bar: tessercheck zero findings +
    # mypy --strict + pytest. Every tesser role and object, conformant, with
    # the least business logic that shows how things work. The tests start
    # their own private Restate engines and Postgres (docs/design-test-tiers.md),
    # so the job runs no service containers.
    name: minimal example (tessercheck + mypy --strict + pytest, engines owned by the tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/minimal/requirements-dev.txt
      - name: examples/minimal — tessercheck + mypy --strict + pytest
        run: scripts/verify minimal

  durable-execution-example:
    # Gates the durable-execution example at the same bar: tessercheck zero
    # findings + mypy --strict + pytest. One context whose workflows run on
    # Restate: one FastAPI host serves POST /submissions, /orders and
    # /purchases and mounts the Restate endpoint. The tests start their own
    # private engines and serve that host themselves (docs/design-test-tiers.md),
    # so the job runs no service containers.
    name: durable-execution example (tessercheck + mypy --strict + pytest, engines owned by the tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/durable-execution/requirements-dev.txt
      - name: examples/durable-execution — tessercheck + mypy --strict + pytest
        run: scripts/verify durable-execution

  voice-example:
    # Gates the voice example at the same bar: tessercheck zero findings +
    # mypy --strict + pytest. One context, calls, whose root-tier test places
    # a call for a person through the client and reads the person's name back
    # by the call id. place_call runs a Restate workflow whose action writes the
    # call to Postgres. The tests start their own private Restate engines and
    # Postgres (docs/design-test-tiers.md), so the job runs no service
    # containers.
    name: voice example (tessercheck + mypy --strict + pytest, engines owned by the tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/voice/requirements-dev.txt
      - name: examples/voice — tessercheck + mypy --strict + pytest
        run: scripts/verify voice

  asyncpg-example:
    # Gates the minimal tree with a real database behind it: asyncpg
    # repositories in both contexts, each behind a store that owns the
    # transaction — Postgres-only, with no memory backend to fall back to — and
    # an e2e that bootstraps through the app loader alone. The tests start a
    # private Postgres of their own (docs/design-test-tiers.md), so the job
    # runs no service containers.
    name: asyncpg example (tessercheck + mypy --strict + pytest, Postgres owned by the tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/asyncpg/requirements-dev.txt
      - name: examples/asyncpg — tessercheck + mypy --strict + pytest
        run: scripts/verify asyncpg

  serdepy-example:
    # Gates the serialization-norm worked example (Python) at the same bar:
    # tessercheck zero findings + mypy --strict + pytest. Shows every
    # canonical-exit case in running code (all four conversion dunders, the
    # Decimal and datetime text policies, zero-dunder compound, parts with a
    # derived field diverging from the spec, an edge golden) — the all-cases
    # companion to python-app's production-shaped parts impl.
    name: serdepy example (tessercheck + mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/serdepy/requirements-dev.txt
      - name: examples/serdepy — tessercheck + mypy --strict + pytest
        run: scripts/verify serdepy

  errorspy-example:
    # Gates the error-norms worked example (Python) at the same bar:
    # tessercheck zero findings + mypy --strict + pytest. Proves the
    # error-handling conventions in running, type-checked code before they are
    # taught.
    name: errorspy example (tessercheck + mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/errorspy/requirements-dev.txt
      - name: examples/errorspy — tessercheck + mypy --strict + pytest
        run: scripts/verify errorspy

  tesser-py:
    # The only job with a Python matrix, and the reason is the runtime library
    # itself: tesser-py is the one tree consumers *import*, so it runs on
    # whatever interpreter they have, not on the one this repo pins. Issue #149
    # was a ts.Outcome gate that read a namespace CPython 3.13 writes to during
    # class creation and 3.12 does not — every outcome raised at import on a
    # current 3.13 while a 3.12-only matrix stayed green. The 3.14 arm caught
    # the same shape one base over: PEP 649 leaves __annotate_func__ where a
    # class body used to leave __annotations__, so ts.Record's class-level
    # default gate read an empty mapping and stopped rejecting. Each version
    # resolves to the newest patch the runner has, which is the point: this
    # arm is here to see an interpreter change before a consumer does.
    name: tesser-py runtime library on ${{ matrix.python-version }} (mypy --strict + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: pip install -r tesser-py/requirements-dev.txt
      - name: tesser-py — tessercheck (shells rows) + mypy --strict (tree + mutmut fixtures) + pytest (incl. the mutmut ecosystem gate) + the built wheel ships every subpackage
        # The wheel check is not redundant with the type/test gates: the
        # enumerated packages list once silently dropped tesser.testing and
        # tesser.srv, and every other job reaches the source via PYTHONPATH, so
        # only building the distribution can catch that omission class.
        run: scripts/verify tesser-py

  specs-app:
    # Gates the specs app at the same bar: tessercheck zero findings + mypy
    # --strict + pytest. Its root tests include a Playwright test that drives
    # the product specification page against the HTTP host the verify arm
    # serves as a process, so the job installs Chromium before it runs.
    name: specs-app (tessercheck + mypy --strict + pytest + playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r specs-app/requirements-dev.txt
      - name: Install the browser the page test drives
        run: python -m playwright install --with-deps chromium
      - name: specs-app — tessercheck + mypy --strict + pytest
        run: scripts/verify specs-app

  story-drafting:
    # Gates the story-drafting app at the same bar: tessercheck zero findings
    # + mypy --strict + pytest. A two-step agent skill backed by a durable
    # workflow, and the baseline for measuring how agents build a tesser app
    # from one user story. The tests start their own private Restate engines
    # and serve the host themselves (docs/design-test-tiers.md), so the job
    # runs no service containers.
    name: story-drafting app (tessercheck + mypy --strict + pytest, engines owned by the tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r story-drafting/requirements-dev.txt
      - name: story-drafting — tessercheck + mypy --strict + pytest
        run: scripts/verify story-drafting

  tessercheck-py:
    # The merged analyzer (the sigcheck engine, graduated): self-check over its
    # own tree, the RULES.md drift gate, mypy --strict, pytest, and the import
    # contracts — the same bar every example tree is held to.
    name: tessercheck-py (self-check + RULES.md drift + mypy --strict + pytest + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r tessercheck-py/requirements-dev.txt
      - name: tessercheck-py — self-check + RULES.md drift + mypy --strict + pytest + import contracts
        run: scripts/verify tessercheck-py

  packaging:
    # What `pip install` gets you, which no other job covers: every other gate
    # runs from a checkout with PYTHONPATH pointed at the source, so a module
    # missing from a wheel's package list — or one importing a package the
    # wheel cannot ship — stays invisible. Installs the three distributions
    # into a clean virtualenv with no source tree on the path, imports
    # everything shipped, and runs the console script for real.
    name: packaging (clean-venv install + tessercheck-check smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip install the distributions and run tessercheck-check
        run: scripts/verify-packaging
