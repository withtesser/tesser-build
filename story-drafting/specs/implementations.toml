# 5 IMPLEMENTATIONS — what satisfies each contract, per environment.

[implementations.StoryDrafter.fixed]
class = "FixedStoryDrafter"
body = "agent"

[implementations.JtbdRepository.sqlite]
class = "SqliteJtbdRepository"
body = "agent"

[implementations.JtbdIdentityRepository.uuid]
body = "supported"

[environments.gate]
implementations = { StoryDrafter = "fixed", JtbdRepository = "sqlite", JtbdIdentityRepository = "uuid" }
engine = "restate"
hosts = ["http"]
