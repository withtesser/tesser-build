# 3 COMPOSITION — the contracts of the loans context. See ../README.md.

context = "loans"

[aggregate]
name = "Loan"
identity = "loan_id"
serves = ["s-1"]

[aggregate.spec]
loan_id = "str"
borrower = "str"
title = "str"

[aggregate.reads]
loan_id = "str"
borrower = "str"
title = "str"

[interfaces.http]
serves = ["s-1-a-1", "s-1-b-1"]

[client.operations.lend_book]
route = "POST /loans"                    # the level-2 story's method and path
status = 201                          # what it answers with
kind = "write"
request = ["borrower", "title"]
response = ["loan_id"]
steps = ["identity.issue_loan_id", "repository.save_loan", "orchestrator.start_arrange_loan"]
serves = ["s-1", "s-1-a-1"]

[client.operations.get_loan]
route = "GET /loans/{loan_id}"           # the level-2 story's method and path
status = 200                          # what it answers with
kind = "read"
request = ["loan_id"]
response = ["loan_id", "borrower", "title"]
steps = ["repository.load_loan"]
serves = ["s-1", "s-1-b-1"]

[orchestrator.operations.arrange_loan]
request = ["loan_id", "borrower", "title"]
response = ["loan_id"]
steps = ["actions.notice.send_notice", "actions.loan.record_loan", "signal.await_return_book"]
serves = ["s-1"]

[signals.return_book]
payload = ["loan_id"]
resolved = false
serves = ["s-1"]

[actions.notice]
port = "NoticeSender"

[actions.notice.operations.send_notice]
calls = "send_notice"
request = ["loan_id", "borrower", "title"]
response = ["loan_id"]
serves = ["s-1"]

[actions.loan]
port = "LoanRepository"

[actions.loan.operations.record_loan]
builds = "Loan"
calls = "save_loan"
request = ["loan_id", "borrower", "title"]
response = ["loan_id"]
serves = ["s-1"]

[ports.NoticeSender]
operations.send_notice = { request = ["borrower", "title"], response = [] }
serves = ["s-1"]

[ports.LoanRepository]
operations.save_loan = { request = ["loan"], response = [] }
operations.load_loan = { request = ["loan_id"], response = ["loan"] }
serves = ["s-1"]

[ports.LoanIdentityRepository]
operations.issue_loan_id = { request = [], response = ["loan_id"] }
serves = ["s-1"]
