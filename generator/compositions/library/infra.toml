# 3 INFRA — what the app runs on, and what an operator must provide. See ../README.md.

app = "library"

[runtime]
language = "python"
version = "3.12"

[engine.restate]
body = "supported"
engine_path = "/restate"
engine_url_variable = "RESTATE_URL"
admin_variable = "RESTATE_ADMIN"
callback_host_variable = "RESTATE_CALLBACK_HOST"

[hosts.http]
serves = "interfaces.http"
listen_port_variable = "LIBRARY_PORT"

[storage.memory]

[variables]
RESTATE_URL = "the engine's URL, the one the client starts workflows through"
RESTATE_ADMIN = "the Restate admin URL the tests register a served endpoint with"
RESTATE_CALLBACK_HOST = "the host name Restate reaches a served endpoint at, read by the tests that register one"
LIBRARY_PORT = "the port the HTTP host listens on"
