# 4 COMPOSITION — the contracts of the loans context. See ../README.md.
#
# library's contracts with no workflow: lend_book's steps call the identity
# port, the notice gateway, and the repository in turn, and it answers once the
# loan is saved. There is no [orchestrator], [actions], or [signals], since
# infra.toml declares no engine to run them.

context = "loans"

[aggregate]
name = "Loan"
identity = "loan_id"
serves = ["s-1"]

[aggregate.spec]
loan_id = "str"
borrower = "str"
title = "str"

[aggregate.reads]
loan_id = "str"
borrower = "str"
title = "str"

[interfaces.http]
serves = ["s-1-a-1", "s-1-b-1"]

[client.operations.lend_book]
kind = "write"
request = ["borrower", "title"]
response = ["loan_id"]
steps = ["identity.issue_loan_id", "gateway.send_notice", "repository.save_loan"]
serves = ["s-1", "s-1-a-1"]

[client.operations.get_loan]
kind = "read"
request = ["loan_id"]
response = ["loan_id", "borrower", "title"]
steps = ["repository.load_loan"]
serves = ["s-1", "s-1-b-1"]

[ports.NoticeSender]
operations.send_notice = { request = ["borrower", "title"], response = [] }
serves = ["s-1"]

[ports.LoanRepository]
operations.save_loan = { request = ["loan"], response = [] }
operations.load_loan = { request = ["loan_id"], response = ["loan"] }
serves = ["s-1"]

[ports.LoanIdentityRepository]
operations.issue_loan_id = { request = [], response = ["loan_id"] }
serves = ["s-1"]
