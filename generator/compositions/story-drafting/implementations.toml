# Specs, in reading order: 1 language, 2 story, 3 infra, 4 composition,
# 5 implementations, 6 generator. Each fact lives in the one spec whose question
# it answers; what a convention derives (TB085 names, a class named for its
# aggregate) is in none.
#
# 5 IMPLEMENTATIONS — Which adapter implementation satisfies each port, in which
# environment? Written by red, reviewed. Changing it changes what runs; each
# implementation named here satisfies a contract in composition.toml, and a store
# port's implementation is named for a storage infra.toml declares. The engine,
# the hosts, and the variables are infra.toml's. The composition root
# (component/component.py) is the code that reads it.

# ---- implementations: what satisfies each contract --------------------------
# Each names its type. The generator stubs every implementation against the
# contract it satisfies; the body is the agent's, except for a type the toolkit
# supports (memory, uuid, postgres), whose body follows from the type and the
# contract.

[implementations.StoryDrafter.template]
class = "TemplateStoryDrafter"         # deterministic: fills fixed templates with the job to be done's parts
body = "agent"

[implementations.JtbdRepository.sqlite]  # the storage infra.toml declares
class = "SqliteJtbdRepository"         # agent-owned: rendered once as a working in-memory stub
body = "agent"

[implementations.JtbdIdentityRepository.uuid]
body = "supported"

# ---- environments -----------------------------------------------------------
# gate: what scripts/verify and CI run. local: a developer's machine.
# A contract with one implementation in every environment needs no selector variable.

[environments.gate]
implementations = { StoryDrafter = "template", JtbdRepository = "sqlite", JtbdIdentityRepository = "uuid" }
engine = "restate"
hosts = ["http"]

[environments.local]
implementations = { StoryDrafter = "template", JtbdRepository = "sqlite", JtbdIdentityRepository = "uuid" }
engine = "restate"
hosts = ["http"]
