# 4 COMPOSITION — the contracts of the loans context. See ../README.md.
#
# library-direct's loans, in an app of two contexts: lend_book first checks the
# book against the catalog, a port whose gateway reaches the catalog context
# (composition.catalog.toml) through its client (implementations.toml:
# reaches = "catalog").

context = "loans"

[aggregate]
name = "Loan"
identity = "loan_id"
serves = ["s-1"]

[aggregate.spec]
loan_id = "str"
borrower = "str"
book_id = "str"

[aggregate.reads]
loan_id = "str"
borrower = "str"
book_id = "str"

[interfaces.http]
serves = ["s-1-a-1", "s-1-b-1"]

[client.operations.lend_book]
kind = "write"
request = ["borrower", "book_id"]
response = ["loan_id"]
steps = ["gateway.check_book", "identity.issue_loan_id", "gateway.send_notice", "repository.save_loan"]
serves = ["s-1", "s-1-a-1"]

[client.operations.get_loan]
kind = "read"
request = ["loan_id"]
response = ["loan_id", "borrower", "book_id"]
steps = ["repository.load_loan"]
serves = ["s-1", "s-1-b-1"]

[ports.BookRegister]
operations.check_book = { request = ["book_id"], response = [] }

[ports.NoticeSender]
operations.send_notice = { request = ["borrower", "book_id"], response = [] }
serves = ["s-1"]

[ports.LoanRepository]
operations.save_loan = { request = ["loan"], response = [] }
operations.load_loan = { request = ["loan_id"], response = ["loan"] }
serves = ["s-1"]

[ports.LoanIdentityRepository]
operations.issue_loan_id = { request = [], response = ["loan_id"] }
serves = ["s-1"]
