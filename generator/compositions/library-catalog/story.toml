# 2 STORY — what a librarian must be able to observe. See ../README.md.

[[jtbds]]
id = "j-root"
level = 1
as = "a librarian"
i_want = "every book I lend to be on record until it comes back"
so_that = "I always know who has which book"

[[jtbds.stories]]
id = "s-1"
given = "a borrower and a book in the catalog"
when = "I lend the book to the borrower"
then = "the loan is on record and I can read it back"

[[jtbds.stories.jtbds]]
id = "j-1-a"
level = 2
as = "the loans HTTP API"
i_want = "to take a loan and answer with its identity"
so_that = "s-1 is fulfilled"

[[jtbds.stories.jtbds.stories]]
id = "s-1-a-1"
given = "a borrower and a book_id"
when = "I POST them as JSON to /loans"
then = "I get back 201 with its loan_id"
route = "POST /loans"
status = 201

[[jtbds.stories.jtbds]]
id = "j-1-b"
level = 2
as = "the loans HTTP API"
i_want = "to answer with a loan"
so_that = "s-1 is fulfilled"

[[jtbds.stories.jtbds.stories]]
id = "s-1-b-1"
given = "I have created a loan with POST /loans"
when = "I GET /loans/{loan_id}"
then = "I get back 200 with its borrower and book_id"
route = "GET /loans/{loan_id}"
status = 200

[[jtbds]]
id = "j-catalog"
level = 1
as = "a librarian"
i_want = "every book I lend to be in the catalog"
so_that = "I know which books the library holds"

[[jtbds.stories]]
id = "s-2"
given = "a book the library holds"
when = "I add it to the catalog with its title"
then = "it gets a book_id, and I can read its title back"

[[jtbds.stories.jtbds]]
id = "j-2-a"
level = 2

[[jtbds.stories.jtbds.stories]]
id = "s-2-a-1"
given = "a title"
when = "I POST it as JSON to /books"
then = "I get back 201 with its book_id"
route = "POST /books"
status = 201

[[jtbds.stories.jtbds]]
id = "j-2-b"
level = 2

[[jtbds.stories.jtbds.stories]]
id = "s-2-b-1"
given = "I have added a book with POST /books"
when = "I GET /books/{book_id}"
then = "I get back 200 with its book_id and title"
route = "GET /books/{book_id}"
status = 200
