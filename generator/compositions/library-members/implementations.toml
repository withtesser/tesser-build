# 5 IMPLEMENTATIONS — what satisfies each contract, per environment. See ../README.md.

[implementations.NoticeSender.printed]
class = "PrintedNoticeSender"
body = "agent"

[implementations.LoanRepository.memory]
body = "supported"

[implementations.LoanIdentityRepository.uuid]
body = "supported"

# reaches: the gateway is handed the members context's client, so the app
# builds members first and hands its client to this gateway.
[implementations.MemberRegister.members]
class = "MembersMemberRegister"
body = "agent"
reaches = "members"

[implementations.MemberRepository.memory]
body = "supported"

[implementations.MemberIdentityRepository.uuid]
body = "supported"

[environments.gate]
implementations = { NoticeSender = "printed", LoanRepository = "memory", MemberRegister = "members", MemberRepository = "memory", MemberIdentityRepository = "uuid", LoanIdentityRepository = "uuid" }
hosts = ["http"]
