# 4 COMPOSITION — the contracts of the loans context. See ../README.md.
#
# library-direct's loans, in an app of two contexts: lend_book first checks the
# borrower against the member register, a port whose gateway reaches the
# members context (composition.members.toml) through its client
# (implementations.toml: reaches = "members").

context = "loans"

[aggregate]
name = "Loan"
identity = "loan_id"
serves = ["s-1"]

[aggregate.spec]
loan_id = "str"
borrower = "str"
title = "str"

[aggregate.reads]
loan_id = "str"
borrower = "str"
title = "str"

[interfaces.http]
serves = ["s-1-a-1", "s-1-b-1"]

[client.operations.lend_book]
kind = "write"
request = ["borrower", "title"]
response = ["loan_id"]
steps = ["gateway.check_member", "identity.issue_loan_id", "gateway.send_notice", "repository.save_loan"]
serves = ["s-1", "s-1-a-1"]

[client.operations.get_loan]
kind = "read"
request = ["loan_id"]
response = ["loan_id", "borrower", "title"]
steps = ["repository.load_loan"]
serves = ["s-1", "s-1-b-1"]

[ports.MemberRegister]
operations.check_member = { request = ["borrower"], response = [] }

[ports.NoticeSender]
operations.send_notice = { request = ["borrower", "title"], response = [] }
serves = ["s-1"]

[ports.LoanRepository]
operations.save_loan = { request = ["loan"], response = [] }
operations.load_loan = { request = ["loan_id"], response = ["loan"] }
serves = ["s-1"]

[ports.LoanIdentityRepository]
operations.issue_loan_id = { request = [], response = ["loan_id"] }
serves = ["s-1"]
