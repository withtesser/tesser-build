# 4 COMPOSITION — the contracts of the members context, the second context of
# this app. See ../README.md ("Several contexts in one app").

context = "members"

[aggregate]
name = "Member"
identity = "member_id"

[aggregate.spec]
member_id = "str"
name = "str"

[aggregate.reads]
member_id = "str"
name = "str"

[interfaces.http]
serves = ["s-2-a-1", "s-2-b-1"]

[client.operations.register_member]
request = ["name"]
response = ["member_id"]
steps = ["identity.issue_member_id", "repository.save_member"]
serves = ["s-2-a-1"]

[client.operations.get_member]
request = ["member_id"]
response = ["member_id", "name"]
steps = ["repository.load_member"]
serves = ["s-2-b-1"]

[ports.MemberRepository]
operations.save_member = { request = ["member"], response = [] }
operations.load_member = { request = ["member_id"], response = ["member"] }

[ports.MemberIdentityRepository]
operations.issue_member_id = { request = [], response = ["member_id"] }
