app_name = "story_drafting"
bounded_context_name = "drafting"
aggregate_root_class_name = "Jtbd"
durable_execution_engine = "restate"
storage = "memory"
host = "http"
identity_field_name = "jtbd_id"
identity_port_operation_name = "issue_jtbd_id"

[aggregate_fields]
situation = "str"
motivation = "str"
outcome = "str"

[sample_values]
jtbd_id = ["jtbd-1", "jtbd-2"]
situation = ["I am working through a multi-step piece of work with an agent", "I am designing a feature with an agent"]
motivation = ["the steps and my checkpoints fixed in advance", "my sign-off to be a fixed step"]
outcome = ["I can step away and resume where we were", "I stop re-explaining the procedure"]

[client]
write_operation_name = "submit_jtbd"
read_operation_name = "get_jtbd"
read_response_fields = ["jtbd_id", "situation", "motivation", "outcome"]

[orchestrator]
operation_name = "work_through_jtbd"

[action]
operation_name = "record_jtbd"

[repository]
save_operation_name = "save_jtbd"
load_operation_name = "load_jtbd"
load_response_collection_name = "jtbds"

[acceptance_test]
test_class_name = "TestSubmittingJtbds"
test_method_name = "test_a_submitted_jtbd_stops_at_the_pick_with_drafts_and_none_picked"
asserted_field = "situation"
random_values = ["I am designing a checkout flow with an agent", "I am planning a data migration with an agent", "I am building a CLI with an agent"]

[environment_variables]
restate_ingress_url = "RESTATE_INGRESS"
host_url = "STORY_DRAFTING_HOST"
