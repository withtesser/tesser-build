app_name = "story_drafting"
bounded_context_name = "story_drafting"
aggregate_root_class_name = "Jtbd"
durable_execution_engine = "restate"
storage = "memory"
host = "http"
identity_field_name = "jtbd_id"
identity_port_operation_name = "issue_jtbd_id"

[aggregate_fields]
job = "str"

[sample_values]
jtbd_id = ["jtbd-1", "jtbd-2"]
job = ["Design the export, get my sign-off, then build it", "Plan the migration, get my sign-off, then run it"]

[client]
write_operation_name = "submit_jtbd"
read_operation_name = "get_jtbd"
read_response_fields = ["jtbd_id", "job"]

[orchestrator]
operation_name = "work_through_jtbd"
calling_mode = "start"

[action]
operation_name = "record_jtbd"

[repository]
save_operation_name = "save_jtbd"
load_operation_name = "load_jtbd"
load_response_collection_name = "jtbds"

[acceptance_test]
test_class_name = "TestSubmittingJtbds"
test_method_name = "test_a_submitted_jtbd_stops_at_the_pick_with_drafts_and_none_picked"
asserted_field = "job"
random_values = ["Design the export, get my sign-off, then build it", "Plan the migration, get my sign-off, then run it", "Sketch the onboarding, get my sign-off, then ship it"]

[environment_variables]
restate_ingress_url = "RESTATE_INGRESS"
host_url = "STORY_DRAFTING_HOST"
