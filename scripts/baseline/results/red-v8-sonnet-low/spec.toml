app_name = "story_drafting"
bounded_context_name = "drafting"
aggregate_root_class_name = "Jtbd"
durable_execution_engine = "restate"
storage = "memory"
host = "http"
identity_field_name = "jtbd_id"
identity_port_operation_name = "issue_jtbd_id"

[aggregate_fields]
situation = "str"
motivation = "str"
outcome = "str"

[sample_values]
jtbd_id = ["jtbd-1", "jtbd-2"]
situation = ["working through a multi-step piece of work with an agent", "reviewing a design with an agent"]
motivation = ["the steps and checkpoints fixed in advance", "the checkpoints to survive across sessions"]
outcome = ["resume at the step we were on", "step away and come back"]

[client]
write_operation_name = "submit_jtbd"
read_operation_name = "check_jtbd"
read_response_fields = ["jtbd_id", "situation", "motivation", "outcome"]

[orchestrator]
operation_name = "begin_drafting"
calling_mode = "start"

[action]
operation_name = "record_jtbd"

[repository]
save_operation_name = "save_jtbd"
load_operation_name = "load_jtbd"
load_response_collection_name = "jtbds"

[acceptance_test]
test_class_name = "TestSubmittingAJtbd"
test_method_name = "test_a_submitted_jtbd_is_drafting"
asserted_field = "situation"
random_values = ["working through a multi-step piece of work with an agent", "designing something and getting sign-off before building"]

[environment_variables]
restate_ingress_url = "RESTATE_INGRESS"
host_url = "STORY_DRAFTING_HOST"
