app_name = "story_drafting"
bounded_context_name = "jtbds"
aggregate_root_class_name = "Jtbd"
durable_execution_engine = "restate"
storage = "memory"
host = "http"
identity_field_name = "jtbd_id"
identity_port_operation_name = "issue_jtbd_id"

[aggregate_fields]
situation = "str"
motivation = "str"
outcome = "str"

[sample_values]
jtbd_id = ["jtbd-1", "jtbd-2"]
situation = ["working through a multi-step piece of work with an agent", "designing a schema with an agent"]
motivation = ["the steps and checkpoints fixed in advance", "my sign-off to survive across sessions"]
outcome = ["step away and resume at the step we were on", "come back without re-explaining"]

[client]
write_operation_name = "submit_jtbd"
read_operation_name = "check_status"
read_response_fields = ["jtbd_id", "situation", "motivation", "outcome"]

[orchestrator]
operation_name = "work_through_jtbd"
calling_mode = "start"

[action]
operation_name = "record_submission"

[repository]
save_operation_name = "save_jtbd"
load_operation_name = "load_jtbd"
load_response_collection_name = "jtbds"

[acceptance_test]
test_class_name = "TestSubmittingJtbds"
test_method_name = "test_a_jtbd_checked_on_right_after_submitting_is_drafting"
asserted_field = "situation"
random_values = ["designing a checkout flow", "building a billing export", "migrating a queue"]

[environment_variables]
restate_ingress_url = "RESTATE_INGRESS"
host_url = "STORY_DRAFTING_HOST"
